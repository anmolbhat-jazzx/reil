[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "repository-intelligence"
version = "0.2.0"
description = "Compile any software repository into a portable, AI-native knowledge.kb artifact."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Anmol Bhat", email = "anmol.bhat@jazzx.ai" }]
keywords = ["knowledge-graph", "compiler", "graphify", "repository-intelligence"]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "pydantic>=2.6",
    "typer>=0.12",
    "rich>=13.7",
    "structlog>=24.1",
    "tiktoken>=0.7",
    "graphifyy>=0.9",  # the `graphify` CLI that `reil build` runs (invoked as a subprocess)
]

[project.optional-dependencies]
dev = [
    "ruff>=0.5",
    "black>=24.4",
    "mypy>=1.11",
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "pre-commit>=3.7",
]

[project.scripts]
reil = "knowledge_builder.cli.main:app"

[project.urls]
Homepage = "https://github.com/anmolbhat/repository-intelligence"

[tool.hatch.build.targets.wheel]
packages = ["knowledge_builder"]

# ---------------------------------------------------------------------------
# Tooling
# ---------------------------------------------------------------------------

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["knowledge_builder", "tests"]
extend-exclude = ["tests/fixtures"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
    "N",   # pep8-naming
    "SIM", # flake8-simplify
    "C4",  # flake8-comprehensions
    "TID", # flake8-tidy-imports
]
ignore = [
    "B008", # function call in argument defaults (typer uses this idiom)
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["N802", "N803"]

[tool.black]
target-version = ["py311"]
line-length = 100
extend-exclude = "tests/fixtures"

# Type-check against the newest supported interpreter so modern dependency stubs
# (e.g. numpy's PEP 695 `type` aliases) parse cleanly. Runtime is still exercised on
# 3.11 by the pytest matrix, so 3.11-incompatible code is still caught.
[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_any_generics = true
warn_redundant_casts = true
warn_unused_ignores = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["tests.*"]
disallow_untyped_defs = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -q"
pythonpath = ["."]

[tool.coverage.run]
source = ["knowledge_builder"]
branch = true
